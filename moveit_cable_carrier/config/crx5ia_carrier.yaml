# ザイルベア（Silveyer / リンクレスケーブルチェーン）の MoveIt 2 衝突モデル設定
#
# 対象:  FANUC CRX-5iA + カッターエンドエフェクタ
# 製品:  3D ロボットドレスパック（igus triflex R 相当。外径 26 mm、R_min = 40 mm）
#        平面 2 次元チェーン（国盛化学 Silveyer KSL/KSH 等）は直線軸用であり、
#        6軸アームの手首には使えない。理由は下の bend_mode 欄を参照。
#
# ブラケット座標系の約束（重要）:
#   base_mount / tip_mount ともに **ローカル +X がケーブルの進行方向**（base → tip の向き）。
#   ソルバは base 側で +X 方向に、tip 側で −X 方向に 1 セグメント分の節点を固定することで、
#   「ブラケットから出る角度」を拘束します。位置だけを固定すると実機のブラケットが許さない
#   角度で出入りしてしまうため、両端 2 節点ずつを固定しています。

carriers:
  - name: crx5ia_wrist_triflex3d

    # ---- 製品仕様（Silveyer KSL-10）--------------------------------------
    bend_radius: 0.040      # R_min = 40 mm
    outer_height: 0.026     # 3D キャリアは円形断面に近い。外径 26 mm 相当
    outer_width: 0.026
    # 【重要】6軸アームの手首には 3D キャリアを使う。
    # Silveyer KSL/KSH のような平面 2 次元チェーンは「直線軸」用で、片側にしか曲がらず
    # ねじれも許さないため、J4/J5/J6 が回る手首では大半の姿勢が成立しない
    # （実測: planar+unilateral だと実行可能率 0.3%）。
    # 業界標準は igus triflex R 系の 3D ロボットドレスパックで、適用範囲はまさに
    # 「軸3〜軸6」。ボール&ソケットで全方向に曲がり、規定曲げ半径とねじれストッパを持つ。
    # よってここは spatial（等方な曲げ半径拘束）を使う。
    bend_mode: spatial
    unilateral: false
    bend_axis: [0.0, 0.0, 1.0]   # spatial では初期推定の膨らむ向きの決定にのみ使う

    # ---- 取り回し長 -------------------------------------------------------
    # 【実測に基づく値】J4/J5/J6 を 5^3 走査したときの実行可能率:
    #     0.49 -> 72.0%    0.50 -> 84.0%    0.52 -> 96.8%
    #     0.55 -> 100.0%   0.60 -> 100.0%
    # ブラケット間距離の最大は 0.478 m だが、それだけでは足りず 0.55 m 必要。
    # 差分は両端の接線拘束を満たすために要る分。
    #
    # 長くするほど到達域は広がるが、その分たるんで膨らむ（トレードオフ）。
    # 弦 0.421 m に対し L=0.52 で弦から 128 mm 膨らむ。これは円弧のサジッタ
    # 計算値 134 mm とほぼ一致しており、モデルの誤りではなく幾何的必然。
    # 膨らみを本気で減らすなら、長さではなく**ブラケットの向き**を
    # 弦方向に合わせる必要がある。
    length: 0.55

    # ---- 離散化 -----------------------------------------------------------
    # seg_len = 0.52/24 = 21.7 mm。1 節点あたり最大 31 度の折れとなり、R=40 mm の円弧を
    # 多角形で近似したときのサジッタ誤差は約 1.4 mm。safety_margin に十分吸収される。
    num_segments: 24
    max_iterations: 80
    tolerance: 0.0001

    # ---- 保守性 -----------------------------------------------------------
    # モデル誤差・ヒステリシス・矩形断面をカプセルで近似したことの差分をまとめて吸収する。
    #
    # 【実測に基づく値】MuJoCo elasticity.cable を参照ソルバとして 62 姿勢で突き合わせた結果:
    #     平均偏差   0.44 mm
    #     最大偏差  21.7 mm  (p99 も同値 = 外れ値 1 件が支配)
    # 最大偏差 21.7 mm に、ブラケットのがたと製造公差分 2 mm を足して 0.024 とした。
    #
    # 重要: これは「重力なし」での比較値。重力ありだと平均 63.6 mm / 最大 193 mm まで
    # 開くが、それはモデル誤差ではなく **重力のモデル化方法の差**（本ソルバの
    # gravity_sag はヒューリスティック）。垂れが効く長い配線では、この値では
    # 足りないので別途 gravity_sag を実測に合わせること。
    #
    # 再現:  carrier_benchmark ... 4 ours.json cases.json
    #        generate_reference_shapes.py --backend mujoco --seed ours.json --gravity 0 \
    #            cases.json ref.json
    #        compare_reference.py ours.json ref.json
    safety_margin: 0.024
    simplify_deviation: 0.002   # 直線区間を間引く。半径に最大 2 mm 上乗せされる
    gravity_sag: 0.15
    gravity_dir: [0.0, 0.0, -1.0]

    # ---- 取り付け ---------------------------------------------------------
    base_link: J3_link
    base_mount:
      xyz: [0.06, 0.0, 0.07]    # 前腕付け根の上面
      rpy: [0.0, 0.0, 0.0]      # +X = 前腕に沿って手首方向
    tip_link: J6_link
    tip_mount:
      xyz: [0.03, 0.0, 0.05]
      rpy: [0.0, 0.0, 0.0]

    # ザイルベアが正当に接触してよいリンク。MoveIt の AttachedBody::touch_links に
    # そのまま渡されるので、ACM を編集する必要はない。
    #
    # J1/J2 も入れる理由: ホーム姿勢（J2=J3=-60度）では腕が折り畳まれ、手首側の配線が
    # 上腕に載る。実機ではただ触れているだけだが、本ソルバは障害物を見ずに最小エネルギー
    # 形状を出すため、載った状態がわずかなめり込みとして現れる（実測 J2_link に 7.1 mm）。
    # これを許可しないと、**ロボットが自分のホーム姿勢で invalid になり計画が始められない**。
    # 配線が実際に沿って通るリンクは全て挙げること。
    touch_links:
      - robot_base
      - J1_link
      - J2_link
      - J3_link
      - J4_link
      - J5_link
      - J6_link

    # ---- 型式（carrier_types.yaml の fl23_cutter_dresspack 相当）----------
    kind: articulated_carrier
    twist_limit_per_link_deg: 10.0    # triflex R 系のねじれストッパ公称値

    # ---- 取り付け方式 ---------------------------------------------------
    # リトラクション（ばね戻し）を試したが、**この配置では効果が無い**。実測:
    #   たるみ 0.04 → 実行可能率 48%   0.10 → 60%   0.16 → 96.8%（＝固定長と同じ）
    # 理由は、ブラケットの出入り角度も拘束されているためたるみが「余分」ではなく
    # 必須だから。零姿勢では弦の向きがブラケットの +X と約 18 度ずれており、
    # S 字を描いて両端の接線を満たすのに長さが要る。たるみを削ると解が消える。
    # リトラクション自体は実装済みなので、実機に付いている場合は
    #   mount_style: retraction  +  retraction_slack / retraction_dir
    # で有効化できる。
    mount_style: fixed


    # 中を通る実配線。キャリア自体は R=40 mm まで曲がるが、φ10 のロボット
    # ケーブルは 10 倍則で 100 mm を要求するので、**効く制約はケーブル側**。
    inner_cables:
      - name: cutter_power_signal
        outer_diameter: 0.010
        min_bend_factor: 10.0
      - name: cutter_air
        outer_diameter: 0.008
        min_bend_factor: 8.0
        count: 2

  # ===========================================================================
  # 上腕側の配線（軸1 → 軸3）。
  # 実機のドレスパックは軸1 下のベースプレートから軸6 まで通すが、
  # 軸3 で一度固定するのが定石なので、上腕側と手首側の 2 本に分けて持つ。
  # 本パッケージは複数本を同時に扱える。
  # ===========================================================================
  - name: crx5ia_upperarm_dresspack
    kind: articulated_carrier
    bend_radius: 0.060
    outer_height: 0.036
    outer_width: 0.036
    bend_mode: spatial
    unilateral: false
    twist_limit_per_link_deg: 10.0
    mount_style: fixed
    length: 0.62
    num_segments: 20
    max_iterations: 200
    tolerance: 0.0001
    safety_margin: 0.008
    simplify_deviation: 0.002
    gravity_sag: 0.2

    base_link: robot_base
    base_mount:
      xyz: [0.0, -0.13, 0.10]
      rpy: [0.0, -1.5708, 0.0]     # +X を上向き（+Z）に = ケーブルの進行方向
    tip_link: J3_link
    tip_mount:
      xyz: [0.0, -0.12, 0.02]
      rpy: [0.0, -1.5708, 0.0]

    # 上腕側も同様に、配線が沿って通るリンクを全て挙げる。
    touch_links:
      - robot_base
      - J1_link
      - J2_link
      - J3_link
      - J4_link

    inner_cables:
      - name: main_harness
        outer_diameter: 0.016
        min_bend_factor: 10.0
